name: Adhan audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/probe_list.json", "scripts/probe_adhan.py", "scripts/build_audio.py", "scripts/audio_spec.json", "scripts/audio-src/**", ".github/workflows/audio.yml"]

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools
        timeout-minutes: 20
        run: |
          sudo apt-get install -y -qq --no-install-recommends ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
          ffmpeg -version | head -1
          if [ ! -f scripts/audio_spec.json ] || [ -f scripts/probe_list.json ]; then pip install --only-binary=:all: --progress-bar off faster-whisper; fi
      - name: Probe recordings
        if: hashFiles('scripts/audio_spec.json') == '' || hashFiles('scripts/probe_list.json') != ''
        run: python3 scripts/probe_adhan.py
      - uses: actions/upload-artifact@v4
        if: hashFiles('scripts/audio_spec.json') == '' || hashFiles('scripts/probe_list.json') != ''
        with:
          name: probe
          path: probe/report.json
      - name: Build and publish the sounds
        if: hashFiles('scripts/audio_spec.json') != '' && hashFiles('scripts/probe_list.json') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build_audio.py
          gh release view audio-v1 >/dev/null 2>&1 || gh release create audio-v1 --title "Adhan sounds" --notes "أصوات الأذان التي يحمّلها التطبيق عند اختيارها" --latest=false
          gh release upload audio-v1 out/audio/* --clobber
