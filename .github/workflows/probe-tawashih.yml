name: Probe tawashih
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/probe_tawashih.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null) && pip install -q faster-whisper tensorflow-cpu tensorflow-hub
      - run: python3 scripts/probe_tawashih.py
