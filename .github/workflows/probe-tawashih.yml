name: Probe tawashih
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/probe_tawashih.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_tawashih.py | tee probe.txt
      - uses: actions/upload-artifact@v4
        with: { name: tawashih, path: probe.txt }
