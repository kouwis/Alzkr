name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["scripts/probe_list.json", "scripts/probe_adhan.py", "scripts/build_audio.py", "scripts/audio_spec.json", ".github/workflows/audio.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Adhan audio"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache downloaded Quran data
        uses: actions/cache@v4
        with:
          path: .data-cache
          key: quran-data-v4

      - name: Build bundled Quran data
        run: |
          pip install fonttools
          python3 scripts/build_data.py
          python3 scripts/build_adhkar.py

      - name: Bundled adhan sounds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/audio
          gh release download audio-v1 -R ${{ github.repository }} -D app/src/main/assets/audio -p catalog.json -p "b-*" --clobber || echo "no adhan sounds release yet"
          ls -la app/src/main/assets/audio

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle :app:assembleRelease --stacktrace

      # Google Play: an app bundle signed with the upload key, when its secrets are set in the repository
      - name: Build Play bundle
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then echo "no upload key secrets yet: no Play bundle"; exit 0; fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" gradle :app:bundleRelease -Pplay --stacktrace
          mkdir -p play && cp app/build/outputs/bundle/release/app-release.aab "play/Alzkr-0.1.${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: alzkr-play-bundle
          path: play/*.aab
          if-no-files-found: ignore

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/alzkr-0.1.${{ github.run_number }}.apk"
          # the same file under a fixed name: https://github.com/<repo>/releases/latest/download/Alzkr.apk
          # always downloads the newest version directly
          cp app/build/outputs/apk/release/app-release.apk out/Alzkr.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alzkr-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: الذِّكر 0.1.${{ github.run_number }}
          body: |
            نسخة تجريبية للاختبار. حمّل ملف الـ APK على موبايلك وافتحه للتثبيت.
            Test build ${{ github.sha }}
          files: out/*.apk
