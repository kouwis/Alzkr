name: Probe video title
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-yt.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=3z72UYe3Hh0&format=json"; echo
          pip install -q yt-dlp && yt-dlp --skip-download --print "%(title)s | %(uploader)s | %(duration)s" "https://youtu.be/3z72UYe3Hh0" || true
          yt-dlp --skip-download --print "%(description)s" "https://youtu.be/3z72UYe3Hh0" | head -30 || true
